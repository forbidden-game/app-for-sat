version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/ai-coach"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web/admin-dashboard"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web/parent-dashboard"
    schedule:
      interval: "weekly"
