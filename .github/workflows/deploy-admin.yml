name: Deploy Admin Dashboard

on:
  push:
    branches: ["master"]
    paths:
      - "web/admin-dashboard/**"
      - ".github/workflows/deploy-admin.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        run: |
          {
            echo 'ADMIN_SSH_KEY<<EOF'
            echo "${{ secrets.ADMIN_SSH_KEY_B64 }}" | base64 --decode
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ADMIN_SSH_HOST }}
          username: ${{ secrets.ADMIN_SSH_USER }}
          key: ${{ env.ADMIN_SSH_KEY }}
          port: ${{ secrets.ADMIN_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /root/apps/app-for-sat
            if [ -n "$(git status --porcelain)" ]; then
              echo "Working tree is dirty. Aborting deploy."
              git status --porcelain
              exit 1
            fi
            PREV_HEAD="$(git rev-parse HEAD)"
            git fetch origin master
            git checkout master
            git pull --ff-only origin master
            if ! git diff --name-only "$PREV_HEAD..HEAD" -- web/admin-dashboard | grep -q .; then
              echo "No admin-dashboard changes detected. Skipping deploy."
              exit 0
            fi
            cd /root/apps/app-for-sat/web/admin-dashboard
            NEED_INSTALL=0
            if [ ! -d node_modules ]; then
              NEED_INSTALL=1
            fi
            if git diff --name-only "$PREV_HEAD..HEAD" -- web/admin-dashboard/package.json web/admin-dashboard/package-lock.json | grep -q .; then
              NEED_INSTALL=1
            fi
            if [ "$NEED_INSTALL" -eq 1 ]; then
              npm ci --no-fund --no-audit
            else
              echo "Dependencies unchanged; skipping npm ci."
            fi
            NODE_OPTIONS=--max-old-space-size=512 npm run build
            systemctl restart admin-dashboard
