name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-admin-dashboard:
    name: Admin Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: web/admin-dashboard
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-${{ runner.os }}-${{ hashFiles('supabase/migrations/*') }}

      - name: Start Supabase Local
        run: |
          supabase start
          supabase db reset

      - name: Run Tests
        working-directory: web/admin-dashboard
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      - name: Stop Supabase
        if: always()
        run: supabase stop || true

  test-parent-dashboard:
    name: Parent Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/parent-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: web/parent-dashboard
        run: npm ci

      - name: Run Tests
        working-directory: web/parent-dashboard
        run: npm run test

  test-edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Tests
        run: deno test --allow-read --allow-env supabase/functions/

  test-ios:
    name: iOS (StudentCore)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Swift Tests
        run: swift test --package-path ios/StudentCore
