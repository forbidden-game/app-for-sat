name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      ios: ${{ steps.filter.outputs.ios }}
      edge_functions: ${{ steps.filter.outputs.edge_functions }}
      supabase_db: ${{ steps.filter.outputs.supabase_db }}
      parent_dashboard: ${{ steps.filter.outputs.parent_dashboard }}
      admin_dashboard: ${{ steps.filter.outputs.admin_dashboard }}
      ai_coach_worker: ${{ steps.filter.outputs.ai_coach_worker }}
      ai_coach_notification_sender: ${{ steps.filter.outputs.ai_coach_notification_sender }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
            ios:
              - 'ios/**'
            edge_functions:
              - 'supabase/functions/**'
            supabase_db:
              - 'supabase/migrations/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
            parent_dashboard:
              - 'web/parent-dashboard/**'
            admin_dashboard:
              - 'web/admin-dashboard/**'
            ai_coach_worker:
              - 'ai-coach/coach-service/**'
            ai_coach_notification_sender:
              - 'ai-coach/notification-sender/**'

  test-admin-dashboard:
    name: Admin Dashboard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.admin_dashboard == 'true' || needs.changes.outputs.supabase_db == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: web/admin-dashboard
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-${{ runner.os }}-${{ hashFiles('supabase/migrations/*', 'supabase/seed.sql', 'supabase/config.toml') }}

      - name: Start Supabase Local
        run: |
          supabase start
          supabase db reset

      - name: Run Tests
        working-directory: web/admin-dashboard
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      - name: Stop Supabase
        if: always()
        run: supabase stop || true

  test-parent-dashboard:
    name: Parent Dashboard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.parent_dashboard == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/parent-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: web/parent-dashboard
        run: npm ci

      - name: Run Tests
        working-directory: web/parent-dashboard
        run: npm run test

  test-edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.edge_functions == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Tests
        run: deno test --allow-read --allow-env supabase/functions/

  test-ai-coach-worker:
    name: AI Coach Service
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.ai_coach_worker == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-coach/coach-service/package-lock.json

      - name: Install dependencies
        working-directory: ai-coach/coach-service
        run: npm ci

      - name: Typecheck
        working-directory: ai-coach/coach-service
        run: npm run check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-${{ runner.os }}-${{ hashFiles('supabase/migrations/*', 'supabase/seed.sql', 'supabase/config.toml') }}

      - name: Start Supabase Local
        run: |
          supabase start
          supabase db reset

      - name: Run Tests
        working-directory: ai-coach/coach-service
        run: npm run test --if-present
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

      - name: Stop Supabase
        if: always()
        run: supabase stop || true

  test-notification-sender:
    name: AI Coach Notification Sender
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.ai_coach_notification_sender == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-coach/package-lock.json

      - name: Install dependencies
        working-directory: ai-coach
        run: npm ci --workspaces --include-workspace-root

      - name: Typecheck
        working-directory: ai-coach
        run: npm run check -w ai-coach-notification-sender

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-${{ runner.os }}-${{ hashFiles('supabase/migrations/*', 'supabase/seed.sql', 'supabase/config.toml') }}

      - name: Start Supabase Local
        run: |
          supabase start
          supabase db reset

      - name: Run Tests
        working-directory: ai-coach
        run: npm run test -w ai-coach-notification-sender --if-present
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      - name: Stop Supabase
        if: always()
        run: supabase stop || true

  test-ios:
    name: iOS (StudentCore + StudentApp)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.ios == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Run Swift Tests
        run: swift test --package-path ios/StudentCore

      - name: Build StudentApp (iOS Simulator)
        run: |
          xcodebuild \
            -project ios/StudentApp/StudentApp.xcodeproj \
            -scheme StudentApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
